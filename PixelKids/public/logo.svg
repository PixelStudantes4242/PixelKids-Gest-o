<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtros e sombras de estilo pixel e relevo -->
    <filter id="pixel-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#182c4f" flood-opacity="0.9" />
    </filter>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Fontes para renderização SVG precisa -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;family=Silkscreen:wght@700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .txt-atacado { font-family: 'Silkscreen', monospace; font-size: 11px; fill: #ffffff; font-weight: 700; letter-spacing: 2px; }
      .txt-kids { font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 82px; font-weight: 700; }
      .txt-tagline { font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: 2.5px; }
    </style>
  </defs>

  <!-- Elementos decorativos de fundo lúdicos (nuvem, balão, pixels coloridos e estrelas) -->
  <g id="decorations">
    <!-- Nuvem pixel com rostinho kawaii -->
    <g transform="translate(420, 32)">
      <!-- Corpo da nuvem pixelada -->
      <rect x="24" y="0" width="48" height="8" fill="#182c4f"/>
      <rect x="16" y="8" width="64" height="8" fill="#182c4f"/>
      <rect x="8" y="16" width="80" height="8" fill="#182c4f"/>
      <rect x="0" y="24" width="96" height="16" fill="#182c4f"/>
      <rect x="8" y="40" width="80" height="8" fill="#182c4f"/>
      
      <!-- Preenchimento branco e azulzinho da nuvem -->
      <rect x="24" y="8" width="48" height="32" fill="#ffffff"/>
      <rect x="16" y="16" width="64" height="24" fill="#ffffff"/>
      <rect x="8" y="24" width="80" height="16" fill="#ffffff"/>
      <rect x="8" y="32" width="80" height="8" fill="#e6f5ff"/>

      <!-- Olhinhos e bochechas kawaii -->
      <rect x="30" y="24" width="6" height="6" fill="#182c4f" rx="1"/>
      <rect x="60" y="24" width="6" height="6" fill="#182c4f" rx="1"/>
      <!-- Boquinha feliz -->
      <path d="M 44 30 Q 48 34 52 30" stroke="#182c4f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Bochechas rosadas -->
      <rect x="22" y="28" width="6" height="4" fill="#ffb6c1" rx="2"/>
      <rect x="68" y="28" width="6" height="4" fill="#ffb6c1" rx="2"/>
    </g>

    <!-- Balão de arco-íris pixelado com cordinha -->
    <g transform="translate(506, 44)">
      <!-- Cordinha ondulada -->
      <path d="M 22 56 Q 16 75 24 95 Q 28 110 22 125" stroke="#182c4f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Nó do balão -->
      <polygon points="18,54 26,54 24,59 20,59" fill="#e52535" stroke="#182c4f" stroke-width="2"/>
      
      <!-- Gomos listrados do balão com contorno escuro -->
      <g stroke="#182c4f" stroke-width="3">
        <!-- Vermelho -->
        <path d="M 22 6 C 14 6 6 18 6 32 C 6 46 16 54 22 54" fill="#e52535"/>
        <!-- Laranja -->
        <path d="M 12 12 C 16 12 18 24 18 32 C 18 42 14 50 12 52" fill="#ff7b1a"/>
        <!-- Amarelo -->
        <path d="M 18 8 C 22 8 23 22 23 32 C 23 44 20 52 18 53" fill="#ffd000"/>
        <!-- Verde -->
        <path d="M 23 7 C 27 7 28 22 28 32 C 28 44 25 53 23 54" fill="#43b02a"/>
        <!-- Azul -->
        <path d="M 28 9 C 32 11 34 22 34 32 C 34 43 30 51 28 52" fill="#0096e6"/>
        <!-- Roxo -->
        <path d="M 22 6 C 30 6 38 18 38 32 C 38 46 28 54 22 54" fill="#8e44ad"/>
      </g>
      <!-- Brilho do balão -->
      <ellipse cx="14" cy="18" rx="3" ry="6" fill="#ffffff" opacity="0.8" transform="rotate(-20 14 18)"/>
    </g>

    <!-- Pixels e estrelinhas espalhadas (idêntico à logo enviada) -->
    <!-- Topo esquerdo -->
    <rect x="240" y="38" width="14" height="14" fill="#e52535"/>
    <rect x="254" y="52" width="14" height="14" fill="#00a3e0"/>
    <rect x="268" y="66" width="14" height="14" fill="#43b02a"/>
    <rect x="226" y="66" width="14" height="14" fill="#8e44ad"/>
    <circle cx="292" cy="46" r="4.5" fill="#ffd000"/>

    <!-- Mini estrelas de 4 pontas -->
    <path d="M 342 42 Q 344 48 350 50 Q 344 52 342 58 Q 340 52 334 50 Q 340 48 342 42 Z" fill="#8e44ad"/>
    <path d="M 396 36 Q 398 42 404 44 Q 398 46 396 52 Q 394 46 388 44 Q 394 42 396 36 Z" fill="#e52535"/>
    <path d="M 488 40 Q 490 44 494 46 Q 490 48 488 52 Q 486 48 482 46 Q 486 44 488 40 Z" fill="#ffd000"/>
    <path d="M 538 116 Q 540 122 546 124 Q 540 126 538 132 Q 536 126 530 124 Q 536 122 538 116 Z" fill="#8e44ad"/>
    
    <!-- Coraçãozinho rosa no topo -->
    <path d="M 366 68 C 366 64 362 60 357 60 C 352 60 350 64 350 64 C 350 64 348 60 343 60 C 338 60 334 64 334 68 C 334 76 350 84 350 84 C 350 84 366 76 366 68 Z" fill="#e91e63"/>

    <!-- Pixels inferiores esquerdos -->
    <rect x="224" y="278" width="14" height="14" fill="#e52535"/>
    <rect x="210" y="292" width="14" height="14" fill="#8e44ad"/>
    <rect x="224" y="306" width="14" height="14" fill="#ffd000"/>
    <rect x="238" y="320" width="14" height="14" fill="#ffd000"/>
    <rect x="238" y="240" width="14" height="14" fill="#43b02a"/>

    <!-- Pixels inferiores direitos -->
    <rect x="510" y="272" width="14" height="14" fill="#00a3e0"/>
    <rect x="532" y="286" width="14" height="14" fill="#ff7b1a"/>
    <rect x="546" y="300" width="14" height="14" fill="#ffd000"/>
    <circle cx="504" cy="316" r="4.5" fill="#e91e63"/>
  </g>

  <!-- FITA LATERAL "ATACADO" -->
  <g id="ribbon-atacado" transform="translate(196, 116)">
    <!-- Corpo da fita -->
    <path d="M 0 0 L 26 0 L 26 130 L 13 118 L 0 130 Z" fill="#00a3e0" stroke="#182c4f" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Texto vertical "ATACADO" -->
    <g transform="rotate(90) translate(8, -8)">
      <text x="0" y="0" class="txt-atacado">ATACADO</text>
    </g>
  </g>

  <!-- PALAVRA "PIXEL" EM ESTILO PIXEL ART -->
  <!-- Letra P -->
  <g id="pixel-letter-P" transform="translate(232, 116)">
    <!-- Base de contorno unificado -->
    <path d="M 0 0 H 64 V 54 H 22 V 92 H 0 Z" fill="#182c4f"/>
    <!-- Bloco interior vazado do P -->
    <rect x="22" y="18" width="20" height="18" fill="#fafaf8" stroke="#182c4f" stroke-width="4"/>
    
    <!-- Quadrados pixel coloridos da letra P -->
    <!-- Coluna esquerda -->
    <rect x="4" y="4" width="15" height="15" fill="#0096e6"/>
    <rect x="4" y="22" width="15" height="15" fill="#43b02a"/>
    <rect x="4" y="40" width="15" height="15" fill="#ffd000"/>
    <rect x="4" y="58" width="15" height="15" fill="#ff7b1a"/>
    <rect x="4" y="74" width="15" height="15" fill="#e52535"/>

    <!-- Arco superior -->
    <rect x="22" y="4" width="18" height="15" fill="#ffd000"/>
    <rect x="43" y="4" width="17" height="15" fill="#ff7b1a"/>
    <rect x="43" y="22" width="17" height="15" fill="#43b02a"/>
    <rect x="43" y="36" width="17" height="15" fill="#0096e6"/>
    <rect x="22" y="36" width="18" height="15" fill="#ff7b1a"/>
  </g>

  <!-- Letra I -->
  <g id="pixel-letter-I" transform="translate(304, 116)">
    <rect x="0" y="0" width="24" height="92" fill="#182c4f" rx="1"/>
    <!-- Blocos da letra I -->
    <rect x="4" y="4" width="16" height="15" fill="#00a3e0"/>
    <rect x="4" y="22" width="16" height="15" fill="#ffd000"/>
    <rect x="4" y="40" width="16" height="15" fill="#e52535"/>
    <rect x="4" y="58" width="16" height="15" fill="#0096e6"/>
    <rect x="4" y="74" width="16" height="15" fill="#43b02a"/>
  </g>

  <!-- Letra X (Pixel X Art) -->
  <g id="pixel-letter-X" transform="translate(336, 116)">
    <!-- Blocos diagonais e centro pixel do X com contorno -->
    <g stroke="#182c4f" stroke-width="4" stroke-linejoin="miter">
      <!-- Canto sup esq -->
      <rect x="0" y="0" width="20" height="20" fill="#8e44ad"/>
      <rect x="14" y="16" width="18" height="18" fill="#e52535"/>
      <!-- Canto sup dir -->
      <rect x="46" y="0" width="20" height="20" fill="#43b02a"/>
      <rect x="34" y="16" width="18" height="18" fill="#0096e6"/>
      <!-- Centro -->
      <rect x="23" y="34" width="20" height="22" fill="#ffd000"/>
      <!-- Canto inf esq -->
      <rect x="14" y="56" width="18" height="18" fill="#ffd000"/>
      <rect x="0" y="72" width="20" height="20" fill="#0096e6"/>
      <!-- Canto inf dir -->
      <rect x="34" y="56" width="18" height="18" fill="#ff7b1a"/>
      <rect x="46" y="72" width="20" height="20" fill="#8e44ad"/>
    </g>
  </g>

  <!-- Letra E -->
  <g id="pixel-letter-E" transform="translate(410, 116)">
    <path d="M 0 0 H 52 V 22 H 22 V 36 H 46 V 56 H 22 V 70 H 52 V 92 H 0 Z" fill="#182c4f"/>
    <!-- Blocos da coluna vertical -->
    <rect x="4" y="4" width="15" height="15" fill="#0096e6"/>
    <rect x="4" y="22" width="15" height="15" fill="#43b02a"/>
    <rect x="4" y="40" width="15" height="15" fill="#ffd000"/>
    <rect x="4" y="58" width="15" height="15" fill="#ff7b1a"/>
    <rect x="4" y="74" width="15" height="15" fill="#e52535"/>
    <!-- Barras horizontais -->
    <rect x="22" y="4" width="14" height="15" fill="#ffd000"/>
    <rect x="37" y="4" width="12" height="15" fill="#8e44ad"/>
    <rect x="22" y="38" width="12" height="15" fill="#ff7b1a"/>
    <rect x="35" y="38" width="8" height="15" fill="#0096e6"/>
    <rect x="22" y="74" width="14" height="15" fill="#ff7b1a"/>
    <rect x="37" y="74" width="12" height="15" fill="#e52535"/>
  </g>

  <!-- Letra L -->
  <g id="pixel-letter-L" transform="translate(470, 116)">
    <path d="M 0 0 H 22 V 70 H 54 V 92 H 0 Z" fill="#182c4f"/>
    <!-- Coluna vertical -->
    <rect x="4" y="4" width="15" height="15" fill="#ff7b1a"/>
    <rect x="4" y="22" width="15" height="15" fill="#ffd000"/>
    <rect x="4" y="40" width="15" height="15" fill="#8e44ad"/>
    <rect x="4" y="58" width="15" height="15" fill="#0096e6"/>
    <rect x="4" y="74" width="15" height="15" fill="#e52535"/>
    <!-- Base horizontal -->
    <rect x="22" y="74" width="14" height="15" fill="#ff7b1a"/>
    <rect x="38" y="74" width="13" height="15" fill="#8e44ad"/>
  </g>

  <!-- PALAVRA "KIDS" EM ESTILO BUBBLE / FORMAS ARREDONDADAS -->
  <g id="kids-word" transform="translate(258, 308)">
    <!-- Sombra e contorno escuro da palavra KIDS (#182c4f) -->
    <!-- Letra K (Azul Sky) -->
    <g transform="translate(0, 0)">
      <path d="M 0 -75 L 0 5 C 0 16 12 18 20 18 C 28 18 28 10 28 5 L 28 -35 L 48 5 C 54 16 66 16 72 10 C 78 4 75 -6 68 -16 L 46 -46 L 66 -66 C 72 -72 68 -82 58 -82 C 50 -82 44 -76 38 -70 L 28 -56 L 28 -75 C 28 -82 20 -82 12 -82 C 4 -82 0 -76 0 -75 Z"
            fill="#0096e6" stroke="#182c4f" stroke-width="9" stroke-linejoin="round"/>
      <!-- Brilho / Highlight branco de bolha -->
      <path d="M 6 -70 L 6 -10 C 6 -5 8 0 10 0" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 44 -74 L 34 -64" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Letra I (Azul Sky) -->
    <g transform="translate(86, 0)">
      <rect x="0" y="-80" width="26" height="96" rx="13" fill="#0096e6" stroke="#182c4f" stroke-width="9" stroke-linejoin="round"/>
      <!-- Highlight -->
      <path d="M 8 -70 L 8 -15" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- Letra D (Laranja Alegre) -->
    <g transform="translate(130, 0)">
      <path d="M 0 -80 L 32 -80 C 58 -80 75 -60 75 -32 C 75 -4 58 16 32 16 L 0 16 Z"
            fill="#ff7b1a" stroke="#182c4f" stroke-width="9" stroke-linejoin="round"/>
      <!-- Miolo do D -->
      <path d="M 24 -56 L 30 -56 C 44 -56 50 -46 50 -32 C 50 -18 44 -8 30 -8 L 24 -8 Z"
            fill="#fafaf8" stroke="#182c4f" stroke-width="7" stroke-linejoin="round"/>
      <!-- Highlight -->
      <path d="M 8 -72 L 8 8" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 30 -72 C 48 -72 63 -56 63 -32" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Letra S (Roxo Lúdico) -->
    <g transform="translate(225, 0)">
      <path d="M 54 -68 C 48 -76 38 -80 26 -80 C 10 -80 0 -68 0 -52 C 0 -34 14 -26 30 -22 C 46 -18 52 -12 52 -4 C 52 6 42 16 26 16 C 12 16 2 8 -2 0 C -6 -8 -16 -4 -16 6 C -16 16 4 24 26 24 C 48 24 68 12 68 -6 C 68 -26 50 -34 34 -38 C 20 -42 16 -46 16 -52 C 16 -58 22 -64 30 -64 C 40 -64 46 -58 50 -54 C 56 -48 64 -56 54 -68 Z"
            fill="#8e44ad" stroke="#182c4f" stroke-width="9" stroke-linejoin="round"/>
      <!-- Highlight -->
      <path d="M 22 -72 C 32 -72 40 -68 44 -62" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 12 -42 C 20 -38 34 -34 46 -30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- FRASE INFERIOR: ★ DOCE MODA INFANTIL ♥ -->
  <g id="tagline" transform="translate(235, 362)">
    <!-- Estrela rosa -->
    <path d="M 0 -6 L 2 -1 L 8 -1 L 3 2 L 5 7 L 0 4 L -5 7 L -3 2 L -8 -1 L -2 -1 Z" fill="#e91e63" transform="translate(0, 0) scale(1.3)"/>
    
    <!-- DOCE (Rosa) -->
    <text x="22" y="5" class="txt-tagline" fill="#e91e63">DOCE</text>
    
    <!-- MODA (Laranja) -->
    <text x="96" y="5" class="txt-tagline" fill="#ff7b1a">MODA</text>
    
    <!-- INFANTIL (Verde) -->
    <text x="180" y="5" class="txt-tagline" fill="#43b02a">INFANTIL</text>
    
    <!-- Coração verde -->
    <path d="M 0 0 C 0 -4 -4 -8 -8 -8 C -12 -8 -14 -4 -14 -4 C -14 -4 -16 -8 -20 -8 C -24 -8 -28 -4 -28 0 C -28 8 -14 16 -14 16 C -14 16 0 8 0 0 Z" fill="#43b02a" transform="translate(324, -3) scale(0.9)"/>
  </g>
</svg>
