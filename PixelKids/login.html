<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelKids - Acesso ao Sistema</title>
  <meta name="description" content="Tela de acesso ao sistema interno PixelKids.">
  <meta property="og:title" content="PixelKids - Acesso ao Sistema">
  <meta property="og:description" content="Tela de login do sistema PixelKids.">
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Silkscreen:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" href="public\PKIco.ico" type="image/x-icon">
  <!-- Folha de Estilos Unificada -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="pixel-bg-pattern login-body">

  <main id="loginMain" class="login-page">
    
    <!-- Elementos lúdicos flutuantes de fundo -->
    <div class="floating-decor top-left" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect x="0" y="0" width="14" height="14" fill="var(--color-primary)" />
        <rect x="18" y="18" width="14" height="14" fill="var(--color-yellow)" />
        <rect x="0" y="32" width="10" height="10" fill="var(--color-purple)" />
      </svg>
    </div>
    
    <div class="floating-decor top-right" aria-hidden="true">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <rect x="14" y="6" width="28" height="6" fill="var(--border-dark)" />
        <rect x="6" y="12" width="44" height="18" fill="var(--border-dark)" />
        <rect x="14" y="12" width="28" height="12" fill="#ffffff" />
        <rect x="8" y="16" width="40" height="8" fill="#ffffff" />
        <circle cx="20" cy="20" r="2" fill="var(--color-pink)" />
        <circle cx="36" cy="20" r="2" fill="var(--color-pink)" />
      </svg>
    </div>

    <div class="floating-decor bottom-left" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <rect x="8" y="8" width="16" height="16" fill="var(--color-green)" rx="2"/>
        <rect x="24" y="0" width="10" height="10" fill="var(--color-secondary)" rx="1"/>
      </svg>
    </div>

    <div class="floating-decor bottom-right" aria-hidden="true">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none">
        <circle cx="22" cy="18" r="14" fill="var(--color-secondary)" stroke="var(--border-dark)" stroke-width="2"/>
        <path d="M 22 32 L 20 44 L 24 44" stroke="var(--border-dark)" stroke-width="2" fill="none"/>
      </svg>
    </div>

    <!-- Cartão Centralizado de Login -->
    <div id="loginCard" class="login-card">
      
      <!-- Logotipo PixelKids -->
      <div class="login-logo-container">
        <img src="public\Logotipo PK.jpeg" alt="Logotipo PixelKids" class="login-logo-img" id="loginLogoImage">
      </div>

      <header class="login-header">
        <h1 id="loginTitle">Acesso ao Sistema</h1>
        <p id="loginSubtitle">
          Informe suas credenciais.
        </p>
      </header>

      <!-- Formulário de Login -->
      <form id="loginForm" class="login-form" action="index.html" method="get">
        
        <div class="form-group">
          <label for="loginUser" class="form-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Login</span>
          </label>
          <input 
            type="text" 
            id="loginUser" 
            name="user" 
            class="pixel-input" 
            placeholder="Digite seu usuário"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Senha</span>
          </label>
          <input 
            type="password" 
            id="loginPassword" 
            name="password" 
            class="pixel-input" 
            placeholder="Digite sua senha"
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn-pixel-primary btn-login-submit">
          <span>Acessar o Sistema</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </form>

      <footer class="login-footer-note">
        <span>PixelKids &bull; Moda Infantil Atacado e Varejo</span>
      </footer>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
